<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Objektväljaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: "Korset". The drop is a cross on the campaign's own concrete: objects run along the
   horizontal axis, colourways along the vertical, the emblem's four-point star marks where they meet. */
:root {
  color-scheme: dark;
  --ink: #0c0c0b;          /* header, film and sign-up ground */
  --char: #171615;
  --rule: #2c2a27;
  --bone: #ece6dc;         /* print cream: text, lines, selected state */
  --bone-dim: rgb(236 230 220 / .5);
  --bone-faint: rgb(236 230 220 / .28);
  --stone: #b3ada3;        /* secondary text on dark */
  --terra: #c2714f;        /* the orange dot from the prints, marks the chosen colour */
  --concrete-veil: rgb(12 12 11 / .4);

  --f: "Archivo", "Helvetica Neue", Arial, sans-serif;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 72px;
  --gutter: clamp(16px, 4vw, 40px);
  --axis-y: 104px;          /* height of the horizontal axis inside the cross */
  --row: 34px;             /* one colourway row on the vertical axis */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--bone);
  font-family: var(--f); font-stretch: 100%; font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--bone); color: var(--ink); }
img, video { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.ui {
  font-family: var(--f); font-stretch: 112%; font-weight: 500;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
}
.wide { font-family: var(--f); font-stretch: 125%; }

/* Header */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-4) var(--gutter); background: var(--ink);
}
.header .wordmark { width: clamp(132px, 38vw, 190px); height: auto; }
.header nav { display: flex; gap: var(--s-5); align-items: center; }
.icon-btn {
  position: relative; display: inline-grid; place-items: center;
  background: none; border: 0; padding: var(--s-2); margin: calc(var(--s-2) * -1); color: var(--bone);
}
.icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.4; }
.bag-count {
  position: absolute; top: -2px; right: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
  background: var(--bone); color: var(--ink); font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
  font-variant-numeric: tabular-nums; transform: scale(0); transition: transform .45s var(--ease-out);
}
.bag-count.has { transform: scale(1); }
.bag-count.bump { transform: scale(1.3); }

/* Film: always the whole original 16:9 frame at source resolution, never cropped or zoomed. */
.hero { position: relative; background: var(--char); }
.hero video { width: 100%; height: auto; aspect-ratio: 1928 / 1076; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgb(12 12 11 / .72), rgb(12 12 11 / 0) 50%); }
.hero-copy { position: absolute; left: var(--gutter); right: var(--gutter); bottom: var(--s-4); z-index: 1; display: grid; gap: var(--s-2); }
.hero-copy a { justify-self: start; color: var(--bone); text-underline-offset: 6px; text-decoration-thickness: 1px; }
@media (min-width: 900px) {
  .hero::after { background: linear-gradient(to top, rgb(12 12 11 / .6), rgb(12 12 11 / 0) 30%); }
  .hero-copy { bottom: var(--s-6); gap: var(--s-3); }
}

/* The cross */
.cross {
  background: linear-gradient(var(--concrete-veil), var(--concrete-veil)), url("img/concrete.webp") center bottom / cover, #55524d;
  padding: var(--s-6) var(--gutter) var(--s-7);
  overflow: hidden;
}
.cross-inner { max-width: 560px; margin: 0 auto; display: grid; gap: var(--s-5); }
.panel { display: grid; gap: var(--s-4); }

/* The drop's two collections, side by side like archive tabs. The second tab starts on the cross's
   vertical axis. A bone bar slides under the open collection. */
.collections { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--bone-dim); }
.coll {
  display: flex; align-items: center; gap: var(--s-3); min-width: 0; padding: var(--s-2) var(--s-2) var(--s-3) 0;
  background: none; border: 0; text-align: left; color: rgb(236 230 220 / .5); transition: color .45s var(--ease-out);
}
.coll:hover, .coll[aria-selected="true"] { color: var(--bone); }
.coll-thumb {
  flex: none; width: 54px; height: 54px; object-fit: contain; opacity: .45;
  filter: drop-shadow(0 4px 4px rgb(12 12 11 / .3)); transition: opacity .45s var(--ease-out), transform .6s var(--ease-out);
}
.coll[aria-selected="true"] .coll-thumb { opacity: 1; transform: translateY(-2px); }
.coll-text { display: grid; gap: 4px; }
.coll-no { font-stretch: 125%; font-weight: 300; font-size: clamp(24px, 7vw, 34px); line-height: 1; letter-spacing: -.01em; }
.coll-sub { font-size: 10px; }
.coll-cap { margin: 0 0 calc(var(--s-3) * -1); color: var(--bone-dim); font-size: 10px; }
.coll-ind {
  position: absolute; left: 0; bottom: -1px; width: 50%; height: 2px; background: var(--bone);
  transform: translateX(calc(var(--o, 0) * 100%)); transition: transform .55s var(--ease-out);
}

/* The axis sits above the garment so the lowest colour stays tappable where the two overlap;
   only its buttons take taps, so the garment underneath can still be swiped and flipped. */
.axis { position: relative; z-index: 2; height: calc(var(--axis-y) + var(--row) * 3 + 20px); pointer-events: none; }
.axis button { pointer-events: auto; }
.v-line { position: absolute; left: 50%; top: 0; width: 1px; height: calc(var(--axis-y) + var(--row) * 1.5); transform: translateX(-.5px); background: var(--bone-dim); pointer-events: none; }
/* Axis captions say what each arm of the cross controls. */
.cap { position: absolute; margin: 0; color: var(--bone-dim); font-size: 10px; pointer-events: none; }
.cap.c { top: -2px; right: calc(50% + 12px); }
/* The horizontal arms end in arrowheads: the object axis reads like a coordinate axis. */
.arm { position: absolute; top: var(--axis-y); height: 0; display: flex; align-items: center; }
.arm.l { left: 0; right: calc(50% + 28px); }
.arm.r { right: 0; left: calc(50% + 28px); }
.arm .line { flex: 1; height: 1px; background: var(--bone-dim); }
.star {
  position: absolute; left: 50%; top: var(--axis-y); width: 40px; height: 40px;
  transform: translate(-50%, -50%); color: var(--bone);
  transition: transform .7s var(--ease-out);
}
.star.turn { transform: translate(-50%, -50%) rotate(90deg); }
.star svg { width: 100%; height: 100%; fill: currentColor; }

.obj {
  flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0;
  background: none; border: 0; color: var(--bone); font-size: 11px;
}
.arm.l .obj { padding-right: var(--s-3); }
.arm.r .obj { padding-left: var(--s-3); }
.obj svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.4; transition: transform .45s var(--ease-out); }
.arm.l .obj:hover svg { transform: translateX(-3px); }
.arm.r .obj:hover svg { transform: translateX(3px); }
.obj[hidden] { display: none; }

.colors {
  position: absolute; left: calc(50% + 18px); top: calc(var(--axis-y) + 16px);
  margin: 0; padding: 0; list-style: none;
  transform: translateY(calc(var(--sel, 2) * var(--row) * -1));
  transition: transform .6s var(--ease-out);
}
.colors button {
  display: flex; align-items: center; gap: 10px; height: var(--row); padding: 0; background: none; border: 0; white-space: nowrap;
  font-size: clamp(15px, 4.1vw, 20px); font-stretch: 112%; font-weight: 400; letter-spacing: .05em; text-transform: uppercase;
  color: rgb(236 230 220 / .62); transition: color .4s var(--ease-out);
}
.colors button:hover { color: var(--bone); }
.colors button[aria-checked="true"] { color: var(--bone); }
.colors button::before {
  content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--terra);
  margin-left: -23px; margin-right: 5px; opacity: 0; transform: scale(.4); transition: opacity .3s, transform .5s var(--ease-out);
}
.colors button[aria-checked="true"]::before { opacity: 1; transform: none; }
/* A square of the real fabric, cut from the product photos. */
.sw {
  flex: none; width: 15px; height: 15px; background: center / cover;
  box-shadow: 0 0 0 1px var(--bone-faint); transition: box-shadow .4s var(--ease-out), transform .5s var(--ease-out);
}
.colors button[aria-checked="true"] .sw { box-shadow: 0 0 0 1px var(--bone); }
.sw.svart { background-image: url("img/swatch-svart.webp"); }
.sw.bla { background-image: url("img/swatch-bla.webp"); }
.sw.camo { background-image: url("img/swatch-camo.webp"); }
.colors li { transition: transform .6s var(--ease-out); }
.colors li.above { transform: translateY(-34px); }

/* Garment */
.stage { position: relative; aspect-ratio: 1 / 1.02; margin-top: calc(var(--row) * -1.2); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.numeral {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--f); font-stretch: 125%; font-weight: 300; letter-spacing: -.03em;
  font-size: min(52vw, 300px); line-height: 1; color: var(--bone-dim);
  transition: opacity .35s, transform .7s var(--ease-out);
}
.numeral.out-l { opacity: 0; transform: translateX(-12%); }
.numeral.out-r { opacity: 0; transform: translateX(12%); }
.garment { position: absolute; inset: 1% 2% 11%; display: grid; place-items: center; cursor: pointer; background: none; border: 0; padding: 0; }
.garment img {
  grid-area: 1 / 1; width: 100%; height: 100%; object-fit: contain;
  filter: drop-shadow(0 18px 16px rgb(12 12 11 / .32));
  opacity: 0; transform: translateX(var(--from, 0)) scale(.97);
  transition: opacity .45s var(--ease-out), transform .75s var(--ease-out);
}
.garment img.on { opacity: 1; transform: none; }
.float { position: absolute; inset: 0; animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-7px); } }
.floor-shadow {
  position: absolute; left: 22%; right: 22%; bottom: 5%; height: 7%;
  background: rgb(12 12 11 / .55); border-radius: 50%; filter: blur(14px);
  animation: shadow 7s ease-in-out infinite;
}
@keyframes shadow { 50% { transform: scaleX(.9); opacity: .8; } }

/* Front/back: a bone block slides under the chosen side. */
.view {
  position: relative; justify-self: center; display: grid; grid-template-columns: 1fr 1fr;
  width: min(100%, 264px); margin-top: calc(var(--s-3) * -1); border: 1px solid var(--bone-dim);
}
.view-ind {
  position: absolute; top: 0; bottom: 0; left: 0; width: 50%; background: var(--bone);
  transform: translateX(calc(var(--v, 1) * 100%)); transition: transform .55s var(--ease-out);
}
.view button {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px;
  padding: 0 var(--s-3); background: none; border: 0; color: var(--bone); font-size: 11px;
  transition: color .45s var(--ease-out);
}
.view button[aria-checked="true"] { color: var(--ink); }

/* Info */
.data { margin: 0; text-align: center; font-size: 12px; color: var(--bone); }
.data span + span::before { content: "·"; margin: 0 .7em; color: var(--bone-dim); }
.sizes { display: flex; justify-content: center; gap: var(--s-3); }
.size {
  width: 56px; height: 56px; background: none; border: 1px solid var(--bone-dim);
  font-size: 17px; font-stretch: 112%; font-weight: 400; transition: background-color .2s, color .2s, border-color .2s;
}
.size:hover { border-color: var(--bone); }
.size[aria-checked="true"] { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.add {
  height: 58px; border: 0; background: var(--bone); color: var(--ink);
  font-size: 15px; font-stretch: 112%; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
  transition: opacity .2s, transform .15s;
}
.add:active { transform: scale(.985); }
.add[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }

/* Sign-up */
.signup { padding: var(--s-7) var(--gutter); }
.signup-inner { max-width: 560px; margin: 0 auto; display: grid; gap: var(--s-4); }
.signup h2 { margin: 0; font-stretch: 125%; font-weight: 400; font-size: clamp(26px, 7.4vw, 44px); line-height: 1.02; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
.signup p { margin: 0; color: var(--stone); max-width: 52ch; }
.signup form { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--bone); }
.signup input { min-width: 0; height: 56px; padding: 0 var(--s-4); border: 0; background: transparent; font-size: 16px; }
.signup input::placeholder { color: var(--stone); }
.signup input:focus-visible { outline: none; }
.signup form:focus-within { outline: 2px solid var(--bone); outline-offset: 3px; }
.signup button { width: 56px; border: 0; background: var(--bone); color: var(--ink); display: grid; place-items: center; }
.signup button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.form-msg { min-height: 1.5em; font-size: 14px; }

.footer { display: flex; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; padding: var(--s-5) var(--gutter) var(--s-6); color: var(--stone); font-size: 11px; border-top: 1px solid var(--rule); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--s-5) + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 140%); width: min(92vw, 420px); visibility: hidden;
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4);
  background: var(--bone); color: var(--ink); box-shadow: 0 18px 40px rgb(0 0 0 / .45);
  transition: transform .55s var(--ease-out), visibility 0s linear .55s;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .55s var(--ease-out), visibility 0s; }
.toast img { width: 48px; height: 48px; object-fit: contain; background: #5a5752; }
.toast small { display: block; color: #4a4741; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="header">
  <img class="wordmark" src="img/wordmark.png" alt="OBJECT 07" width="1180" height="140">
  <nav aria-label="Snabbval">
    <button class="icon-btn" type="button" aria-label="Meny">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
    </button>
    <button class="icon-btn" type="button" aria-label="Varukorg, 0 varor" id="bag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 4h2.6l2.3 11h11l2.1-8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span class="bag-count" id="bag-count">0</span>
    </button>
  </nav>
</header>

<main>
  <section class="hero" aria-label="Kampanjfilm Drop 01">
    <video id="hero" muted loop playsinline preload="metadata" poster="media/hero-poster.jpg" width="1928" height="1076">
      <source src="media/hero.mp4" type="video/mp4">
    </video>
    <div class="hero-copy">
      <span class="ui">Drop 01 · OBJECT #001 &amp; #002</span>
      <a class="ui" href="#droppet">Handla droppet</a>
    </div>
  </section>

  <section class="cross" id="droppet" aria-label="Drop 01: välj kollektion, färg och sida">
    <div class="cross-inner">
      <p class="coll-cap ui" aria-hidden="true">Drop 01 · två kollektioner</p>
      <div class="collections" role="tablist" aria-label="Kollektioner i Drop 01" id="collections">
        <button class="coll" type="button" role="tab" id="tab-001" data-o="001" aria-selected="true" aria-controls="panel">
          <img class="coll-thumb" src="img/svart-camo-sidtryck_fram.webp" alt="" width="54" height="54">
          <span class="coll-text"><span class="coll-no">#001</span><span class="coll-sub ui">Sidtryck</span></span>
        </button>
        <button class="coll" type="button" role="tab" id="tab-002" data-o="002" aria-selected="false" aria-controls="panel" tabindex="-1">
          <img class="coll-thumb" src="img/svart-camo-kyss_bak.webp" alt="" width="54" height="54">
          <span class="coll-text"><span class="coll-no">#002</span><span class="coll-sub ui">Kyssmotiv</span></span>
        </button>
        <span class="coll-ind" aria-hidden="true"></span>
      </div>

      <div class="panel" id="panel" role="tabpanel" aria-labelledby="tab-001">
      <div class="axis">
        <span class="v-line" aria-hidden="true"></span>
        <p class="cap c ui" aria-hidden="true">Färg</p>
        <div class="arm l">
          <button class="obj ui" type="button" id="prev-obj" aria-label="Föregående: OBJECT #001">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg><span id="prev-label">#001</span>
          </button>
          <span class="line" aria-hidden="true"></span>
        </div>
        <div class="arm r">
          <span class="line" aria-hidden="true"></span>
          <button class="obj ui" type="button" id="next-obj" aria-label="Nästa: OBJECT #002">
            <span id="next-label">#002</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
          </button>
        </div>
        <span class="star" id="star" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M20 0 C21.2 13 27 18.8 40 20 C27 21.2 21.2 27 20 40 C18.8 27 13 21.2 0 20 C13 18.8 18.8 13 20 0 Z"/></svg>
        </span>

        <ul class="colors" role="radiogroup" aria-label="Färg" id="colors">
          <li><button type="button" role="radio" data-c="svart" aria-checked="false" id="c-svart"><span class="sw svart" aria-hidden="true"></span>Svart</button></li>
          <li><button type="button" role="radio" data-c="bla" aria-checked="false" id="c-bla"><span class="sw bla" aria-hidden="true"></span>Blå</button></li>
          <li><button type="button" role="radio" data-c="camo" aria-checked="true" id="c-camo"><span class="sw camo" aria-hidden="true"></span>Svart-camo</button></li>
        </ul>
      </div>

      <div class="stage" id="stage">
        <span class="numeral" id="numeral" aria-hidden="true">001</span>
        <div class="float">
          <span class="floor-shadow" aria-hidden="true"></span>
          <button class="garment" type="button" id="garment" aria-label="Vänd plagget"></button>
        </div>
      </div>

      <div class="view" role="radiogroup" aria-label="Visa sida" id="view">
        <span class="view-ind" aria-hidden="true"></span>
        <button class="ui" type="button" role="radio" data-v="fram" aria-checked="true">Framsida</button>
        <button class="ui" type="button" role="radio" data-v="bak" aria-checked="false">Baksida</button>
      </div>

      <p class="data ui" id="data"><span>OBJECT #001</span><span>Svart-camo</span><span>799 kr</span></p>

      <div class="sizes" role="radiogroup" aria-label="Storlek">
        <button type="button" class="size" role="radio" aria-checked="false" id="s-S">S</button>
        <button type="button" class="size" role="radio" aria-checked="false" id="s-M">M</button>
        <button type="button" class="size" role="radio" aria-checked="false" id="s-L">L</button>
        <button type="button" class="size" role="radio" aria-checked="false" id="s-XL">XL</button>
      </div>

      <button class="add" type="button" id="add" aria-disabled="true">Välj storlek</button>
      </div>
    </div>
  </section>

  <section class="signup" id="anmal" aria-labelledby="signup-title">
    <div class="signup-inner">
      <h2 id="signup-title">Få nästa droppet först</h2>
      <p>Anmäl dig så får du ett mejl innan nästa objekt släpps.</p>
      <form id="signup" novalidate>
        <label class="sr" for="email">E-postadress</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Din e-postadress">
        <button type="submit" aria-label="Anmäl dig"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
      </form>
      <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<footer class="footer ui">
  <span>© OBJECT 07 · Est. 2007</span>
  <span>Prototyp · inget sparas eller köps</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite">
  <img id="toast-img" src="img/svart-camo-kyss_bak.webp" alt="" width="48" height="48">
  <div><strong>Lagd i varukorgen</strong><small id="toast-sub"></small></div>
</div>

<script>
(() => {
  const OBJECTS = ["001", "002"];
  const DEFAULT_VIEW = { "001": "fram", "002": "bak" };
  const COLORS = [
    { id: "svart", name: "Svart" },
    { id: "bla", name: "Blå" },
    { id: "camo", name: "Svart-camo" }
  ];
  const file = (o, c, v) => `img/${c === "camo" ? "svart-camo" : c}-${o === "001" ? "sidtryck" : "kyss"}_${v}.webp`;

  const state = { o: "001", c: "camo", v: "fram", size: null, count: 0 };
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EASE = "cubic-bezier(.16, 1, .3, 1)";

  for (const o of OBJECTS) for (const c of COLORS) for (const v of ["fram", "bak"]) { const i = new Image(); i.src = file(o, c.id, v); }

  let current = null, turning = false;
  function showGarment(from = 0, turn = 0) {
    const img = document.createElement("img");
    img.src = file(state.o, state.c, state.v);
    img.alt = `OBJECT #${state.o}, ${COLORS.find(c => c.id === state.c).name.toLowerCase()}, ${state.v === "fram" ? "framsida" : "baksida"}`;
    const old = current;
    current = img;
    if (old) old.getAnimations().forEach(a => a.finish());

    // Front/back: the garment turns on its vertical axis, like a shirt on a hanger.
    if (turn && !reduce) {
      const p = "perspective(1400px) ";
      turning = true; setTimeout(() => turning = false, 560);
      img.style.transition = "none"; img.classList.add("on");
      $("garment").appendChild(img);
      if (old) {
        old.style.transition = "none";
        old.animate([{ transform: p + "rotateY(0deg)" }, { transform: p + `rotateY(${90 * turn}deg)` }],
          { duration: 250, easing: "cubic-bezier(.55, 0, .9, .4)", fill: "forwards" });
        setTimeout(() => old.remove(), 260);
      }
      img.animate([{ transform: p + `rotateY(${-90 * turn}deg)` }, { transform: p + "rotateY(0deg)" }],
        { duration: 680, delay: old ? 240 : 0, easing: EASE, fill: "backwards" })
        .finished.then(() => { img.style.transition = ""; }, () => {});
      return;
    }

    img.style.setProperty("--from", from + "px");
    $("garment").appendChild(img);
    requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add("on")));
    if (old) { old.style.transition = ""; old.style.setProperty("--from", (-from) + "px"); old.classList.remove("on"); setTimeout(() => old.remove(), 600); }
  }

  function render({ from = 0, numeral = 0, turn = 0 } = {}) {
    const ci = COLORS.findIndex(c => c.id === state.c);
    const oi = OBJECTS.indexOf(state.o);
    const list = $("colors");
    list.style.setProperty("--sel", ci);
    list.querySelectorAll("li").forEach((li, i) => {
      li.className = i < ci ? "above" : i > ci ? "below" : "";
      li.querySelector("button").setAttribute("aria-checked", String(i === ci));
    });

    // Collections: tabs, sliding bar, thumbnails in the chosen colour.
    $("collections").style.setProperty("--o", oi);
    for (const t of document.querySelectorAll(".coll")) {
      const on = t.dataset.o === state.o;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      t.querySelector("img").src = file(t.dataset.o, state.c, DEFAULT_VIEW[t.dataset.o]);
    }
    $("panel").setAttribute("aria-labelledby", `tab-${state.o}`);

    // The arms only point where there is another collection.
    const prev = $("prev-obj"), next = $("next-obj");
    prev.hidden = oi === 0;
    next.hidden = oi === OBJECTS.length - 1;
    if (oi > 0) { $("prev-label").textContent = `#${OBJECTS[oi - 1]}`; prev.setAttribute("aria-label", `Till kollektion OBJECT #${OBJECTS[oi - 1]}`); }
    if (oi < OBJECTS.length - 1) { $("next-label").textContent = `#${OBJECTS[oi + 1]}`; next.setAttribute("aria-label", `Till kollektion OBJECT #${OBJECTS[oi + 1]}`); }

    const color = COLORS[ci];
    $("data").innerHTML = `<span>OBJECT #${state.o}</span><span>${color.name}</span><span>799 kr</span>`;
    $("view").style.setProperty("--v", state.v === "fram" ? 0 : 1);
    for (const b of document.querySelectorAll("#view button")) b.setAttribute("aria-checked", String(b.dataset.v === state.v));
    for (const b of document.querySelectorAll(".size")) b.setAttribute("aria-checked", String(b.textContent === state.size));
    const add = $("add");
    add.setAttribute("aria-disabled", String(!state.size));
    add.textContent = state.size ? "Lägg i varukorgen" : "Välj storlek";

    if (numeral) {
      const n = $("numeral");
      n.classList.add(numeral > 0 ? "out-l" : "out-r");
      setTimeout(() => { n.textContent = state.o; n.classList.remove("out-l", "out-r"); }, 280);
    }
    showGarment(from, turn);
  }

  function setView(v) {
    if (v === state.v || turning) return;
    state.v = v;
    render({ turn: v === "bak" ? 1 : -1 });
  }

  function goObject(dir) {
    const oi = OBJECTS.indexOf(state.o) + dir;
    if (oi < 0) return;
    if (oi >= OBJECTS.length) { $("anmal").scrollIntoView({ behavior: "smooth" }); return; }
    state.o = OBJECTS[oi]; state.v = DEFAULT_VIEW[state.o];
    const star = $("star"); star.classList.toggle("turn");
    render({ from: dir * 110, numeral: dir });
  }

  for (const t of document.querySelectorAll(".coll")) t.addEventListener("click", () => {
    const d = OBJECTS.indexOf(t.dataset.o) - OBJECTS.indexOf(state.o);
    if (d) goObject(d);
  });
  $("collections").addEventListener("keydown", e => {
    const d = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
    if (!d) return;
    const oi = OBJECTS.indexOf(state.o) + d;
    if (oi < 0 || oi >= OBJECTS.length) return;
    goObject(d); $(`tab-${state.o}`).focus(); e.preventDefault();
  });
  $("prev-obj").addEventListener("click", () => goObject(-1));
  $("next-obj").addEventListener("click", () => goObject(1));
  document.querySelectorAll(".colors button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.c === state.c) return; state.c = b.dataset.c; render();
  }));
  document.querySelectorAll(".size").forEach(b => b.addEventListener("click", () => { state.size = b.textContent; render(); }));
  document.querySelectorAll("#view button").forEach(b => b.addEventListener("click", () => setView(b.dataset.v)));
  $("garment").addEventListener("click", () => { if (moved) return; setView(state.v === "fram" ? "bak" : "fram"); });

  document.querySelectorAll('[role="radiogroup"]').forEach(group => group.addEventListener("keydown", e => {
    const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (!(e.key in keys)) return;
    const items = [...group.querySelectorAll('[role="radio"]')];
    const i = items.indexOf(document.activeElement); if (i < 0) return;
    const nxt = items[(i + keys[e.key] + items.length) % items.length];
    nxt.focus(); nxt.click(); e.preventDefault();
  }));

  // Horizontal swipe on the garment moves along the object axis.
  let x0 = null, y0 = null, moved = false;
  const stage = $("stage");
  stage.addEventListener("pointerdown", e => { x0 = e.clientX; y0 = e.clientY; moved = false; });
  stage.addEventListener("pointerup", e => {
    if (x0 === null) return;
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    moved = true; setTimeout(() => moved = false, 50);
    goObject(dx < 0 ? 1 : -1);
  });

  let toastTimer;
  $("add").addEventListener("click", () => {
    if (!state.size) { $("s-M").focus(); return; }
    state.count += 1;
    const c = $("bag-count"); c.textContent = state.count; c.classList.add("has", "bump"); setTimeout(() => c.classList.remove("bump"), 400);
    $("bag").setAttribute("aria-label", `Varukorg, ${state.count} ${state.count === 1 ? "vara" : "varor"}`);
    $("toast-img").src = file(state.o, state.c, DEFAULT_VIEW[state.o]);
    $("toast-sub").textContent = `OBJECT #${state.o} · ${COLORS.find(x => x.id === state.c).name} · ${state.size} · 799 kr`;
    const t = $("toast"); t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  });

  $("signup").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("email").value.trim(), msg = $("form-msg");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { msg.textContent = "Skriv en giltig e-postadress, till exempel namn@mejl.se."; $("email").focus(); return; }
    msg.textContent = "Klart. Här skickas ett mejl inför nästa drop (i prototypen sparas inget)."; $("email").value = "";
  });

  // One-time demonstration, the first time the garment is in view and untouched: it leans toward the other
  // collection as if being swiped, the arrowhead and the tab bar point the way, then the other fabrics tick in turn.
  let engaged = false;
  for (const t of ["click", "keydown"]) $("droppet").addEventListener(t, () => engaged = true, { capture: true });
  function demo() {
    if (engaged || turning) return;
    const ease = "cubic-bezier(.45, 0, .2, 1)";
    $("garment").animate([
      { transform: "none" }, { transform: "translateX(-38px) rotate(-1.5deg)", offset: .36 },
      { transform: "translateX(6px) rotate(.3deg)", offset: .7 }, { transform: "none" }
    ], { duration: 1400, easing: ease });
    $("numeral").animate([{ transform: "none" }, { transform: "translateX(-4%)", offset: .36 }, { transform: "none" }], { duration: 1400, easing: ease });
    const ind = document.querySelector(".coll-ind");
    ind.animate([{ transform: "none" }, { transform: "translateX(14%) scaleX(1.12)", offset: .36 }, { transform: "none" }], { duration: 1400, easing: ease });
    document.querySelector(".coll:not([aria-selected='true']) .coll-thumb").animate(
      [{ opacity: .45, transform: "none" }, { opacity: 1, transform: "translateY(-4px)", offset: .36 }, { opacity: .45, transform: "none" }],
      { duration: 1400, easing: ease });
    $("next-obj").querySelector("svg").animate([
      { transform: "none" }, { transform: "translateX(6px)", offset: .2 }, { transform: "none", offset: .4 },
      { transform: "translateX(6px)", offset: .6 }, { transform: "none", offset: .8 }
    ], { duration: 1400, easing: ease });
    document.querySelectorAll(".colors button:not([aria-checked='true']) .sw").forEach((sw, i) =>
      sw.animate([{ transform: "none" }, { transform: "scale(1.45)", offset: .4 }, { transform: "none" }],
        { duration: 560, delay: 1500 + i * 160, easing: EASE }));
  }
  if (!reduce && "IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting)) return;
      io.disconnect(); setTimeout(demo, 700);
    }, { threshold: .6 });
    io.observe($("stage"));
  }

  const hero = $("hero");
  if (!reduce) { hero.autoplay = true; hero.play().catch(() => {}); }

  render();
})();
</script>
</body>
</html>
